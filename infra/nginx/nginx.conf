# HTTP → HTTPS 跳转
server {
  listen 80;
  server_name landongdj.cn www.landongdj.cn;
  return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
  listen 443 ssl;
  server_name landongdj.cn www.landongdj.cn;

  ssl_certificate     /etc/nginx/certs/landongdj.cn.pem;
  ssl_certificate_key /etc/nginx/certs/landongdj.cn.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  root /usr/share/nginx/html;
  index index.html;

  # Admin SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API reverse proxy → 微信云托管
  location /api/ {
    proxy_pass https://api-250442-6-1425509748.sh.run.tcloudbase.com/api/;
    proxy_http_version 1.1;
    proxy_set_header Host api-250442-6-1425509748.sh.run.tcloudbase.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
  }
}
