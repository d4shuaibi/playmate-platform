services:
  postgres:
    image: postgres:16-alpine
    container_name: playmate-postgres
    environment:
      POSTGRES_USER: playmate
      POSTGRES_PASSWORD: playmate
      POSTGRES_DB: playmate
    ports:
      - "5432:5432"
    volumes:
      - playmate_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: playmate-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: playmate-api
    env_file:
      - ./services/api/.env
    environment:
      # 与「真实生产」区分：compose 用于本地/集成联调栈。若需往空库灌演示数据，
      # 先设 SEED_DEMO=true，再在 api 容器外或一次性任务里执行 `pnpm prisma db seed`（勿在线上生产库执行）。
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://playmate:playmate@postgres:5432/playmate?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    container_name: playmate-web
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  playmate_pgdata:

